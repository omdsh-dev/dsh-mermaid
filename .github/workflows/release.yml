name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish (must match package.json)
        required: true
        type: string
permissions: {}
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm pack --out artifacts/package.tgz
      - run: pnpm pack:check artifacts/package.tgz
      - name: Confirm package version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(p.version!==process.env.EXPECTED_VERSION) throw new Error('Version confirmation does not match package.json');"
      - name: Publish checked archive with OIDC
        run: npm publish ./artifacts/package.tgz --access public --provenance
